name: Generate HTML

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate HTML files
        run: ./scripts/generate-html.sh

      - name: Check for changes
        id: changes
        run: |
          git add -N deployment/*.html
          if ! git diff --exit-code deployment/technique_builder.html deployment/all_techniques.html deployment/all_unique.html; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/technique_builder.html deployment/all_techniques.html deployment/all_unique.html
          git commit -m "Regenerate HTML files from techniques.xml"
          git push
