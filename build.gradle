plugins {
    id 'com.barrybecker4.bb4.scala-library' version '2.0.0'
    id 'com.barrybecker4.bb4.publish' version '2.0.0'
    id 'com.barrybecker4.bb4.application' version '2.0.0'
}

description = 'Aikido app generator'
group = 'com.barrybecker4'
version = '2.0-SNAPSHOT'

bb4 {
    archivesBaseName.set('bb4-aikido-app')
    mainClass.set('com.barrybecker4.aikido.AikidoAppGenerator')
}

repositories {
    mavenLocal()
}

dependencies {
    implementation 'com.barrybecker4:bb4-common:2.1-SNAPSHOT'
}
