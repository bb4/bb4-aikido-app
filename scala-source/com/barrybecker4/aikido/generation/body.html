<body class="builder-page" onload="doOnLoad()">
<h1 class="page-title">Aikido Technique Builder</h1>
<p>
Build an aikido technique using successive drop-lists below.<br>
There are still many missing images. More will be added later.<br>
<span class="note">This application was built using XML, java and DHTML (<a href="technique_builder_desc.html">more details</a>).</span>
</p>

<table id="outerTable" class="outer-table">
  <tr>
    <td>
      <div class="builder-scroll">

        <table id="techniqueTable" class="technique-table">
          <tr>
            <td class="step-cell">
              <select id="step0_select" onchange="selectChanged('step0_select')"></select>
            </td>
            <td class="filler-cell">
            </td>
          </tr>
          <tr>
            <td class="step-cell">
              <img id="step0_image" class="thumb" title="select something" src="images/select.png"
                   width="170" height="130" alt="Select a technique step"
                   onmouseover="mousedOnThumbnail('step0_image')">
            </td>
            <td class="filler-cell">
            </td>
          </tr>
        </table>

      </div>
    </td>
  </tr>
  <tr>
    <td>
      <div id="bigImgDiv">
        <img id="big_image" class="big-image" src="images/select.png" alt="Selected technique step">
      </div>
    </td>
  </tr>
</table><br>
</body>
